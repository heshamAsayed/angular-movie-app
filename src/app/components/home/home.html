<!-- Featured Movie Banner -->
<div class="featured-movie" [style.background-image]="'url(' + getMovieBackdrop(featuredMovie?.backdrop_path) + ')'">
  <div class="overlay">
    <h1>{{ featuredMovie?.title }}</h1>
    <p>{{ featuredMovie?.overview }}</p>
    <button (click)="navigateToDetails(featuredMovie?.id)">Watch Now</button>
  </div>
</div>

<!-- Movie Sections -->
<section class="movie-section" *ngIf="popularMovies$ | async as popular">
  <h2>Popular Movies <button (click)="navigateToGroup('popular')">View All</button></h2>
  <div class="movies-row">
    <div class="movie-card" *ngFor="let movie of popular" (click)="navigateToDetails(movie.id)">
      <img [src]="getMoviePoster(movie.poster_path)" [alt]="movie.title">
      <div class="movie-info">
        <h3>{{ movie.title }}</h3>
        <span class="rating" [style.background-color]="getRatingColor(movie.vote_average)">
          {{ movie.vote_average }}
        </span>
      </div>
    </div>
  </div>
</section>
