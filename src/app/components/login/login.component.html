<div class="login-page">
  <div class="login-card">
    <header class="login-header">
      <div class="header-icon" aria-hidden="true">
        <i class="icon-logo"></i>
      </div>
      <h2 class="header-title">Welcome back</h2>
      <p class="header-subtitle">Sign in to continue to MovieApp</p>
    </header>

    <div class="login-body">
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input id="email" class="form-input" type="email" formControlName="email" placeholder="you@example.com" />
          <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            <div *ngIf="form.get('email')?.errors?.['required']">Email is required.</div>
            <div *ngIf="form.get('email')?.errors?.['email']">Enter a valid email.</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-input" type="password" formControlName="password" placeholder="Minimum 6 characters" />
          <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
            <div *ngIf="form.get('password')?.errors?.['required']">Password is required.</div>
            <div *ngIf="form.get('password')?.errors?.['minlength']">Minimum 6 characters.</div>
          </div>
        </div>

        <div class="form-group">
          <button type="submit" class="submit-btn" [disabled]="loading" aria-label="Sign in">{{ loading ? 'Signing in...' : 'Sign in' }}</button>
        </div>

        <div class="divider-section">
          <div class="divider-line"></div>
          <div class="divider-text">OR</div>
          <div class="divider-line"></div>
        </div>

        <div class="form-group">
          <button type="button" class="google-btn social-btn google" (click)="loginWithGoogle()" aria-label="Continue with Google">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <button type="button" class="facebook-btn social-btn facebook" (click)="loginWithFacebook()" aria-label="Continue with Facebook">
            <svg class="facebook-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="#1877F2" d="M24 12c0-6.63-5.37-12-12-12S0 5.37 0 12c0 6 4.39 10.95 10.13 11.86v-8.38h-3.05V12h3.05V9.35c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.23 2.68.23v2.95h-1.51c-1.49 0-1.95.92-1.95 1.87V12h3.32l-.53 3.48h-2.79v8.38C19.61 22.95 24 18 24 12z"/>
            </svg>
            <span>Continue with Facebook</span>
          </button>
        </div>

        <div class="login-section">
          <p class="login-text">Don't have an account? <a [routerLink]="['/register']" class="link">Register</a></p>
          <p style="margin-top:8px;"><a [routerLink]="['/reset-password']" class="link">Forgot password?</a></p>
        </div>

        <div *ngIf="error" class="error server">{{ error }}</div>

      </form>
    </div>
  </div>
</div>
