<div class="register-page" id="mainContainer">
  <div class="register-card">
    <header class="register-header">
      <div class="header-icon" aria-hidden="true"><i data-lucide="film"></i></div>
      <h1 class="header-title">Create Account</h1>
      <p class="header-subtitle">Join Moviey Watch and discover amazing films</p>
    </header>

    <section class="register-body">
      <div *ngIf="!error && false" class="alert custom-alert alert-success" role="alert">
        <i data-lucide="check-circle"></i>
        <span>Account created successfully!</span>
      </div>

      <div *ngIf="error" class="alert custom-alert alert-danger" role="alert">
        <i data-lucide="alert-circle"></i>
        <span>{{ error }}</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="register-form" novalidate>
        <div class="form-grid">
          <label class="form-label">
            Full Name <span class="required">*</span>
            <input type="text" class="form-input" formControlName="name" placeholder="Enter your full name" />
          </label>

          <label class="form-label">
            Email Address <span class="required">*</span>
            <input type="email" class="form-input" formControlName="email" placeholder="you@email.com" />
          </label>

          <label class="form-label">
            Password <span class="required">*</span>
            <div class="password-wrapper">
              <input [type]="showPassword ? 'text' : 'password'" class="form-input" formControlName="password"
                placeholder="Create password" />
              <button type="button" class="password-toggle" (click)="togglePassword()" [attr.aria-pressed]="showPassword">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </label>

          <label class="form-label">
            Confirm Password <span class="required">*</span>
            <div class="password-wrapper">
              <input [type]="showConfirm ? 'text' : 'password'" class="form-input" formControlName="confirm" placeholder="Re-enter password" />
              <button type="button" class="password-toggle" (click)="toggleConfirm()" [attr.aria-pressed]="showConfirm">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </label>

          <label class="form-label">
            Phone Number <span class="optional">(optional)</span>
            <input type="tel" class="form-input" formControlName="phone" placeholder="+20 100 123 4567" />
          </label>

          <label class="form-label">
            Country <span class="optional">(optional)</span>
            <input type="text" class="form-input" formControlName="country" placeholder="Egypt" />
          </label>

          <label class="form-label">
            City <span class="optional">(optional)</span>
            <input type="text" class="form-input" formControlName="city" placeholder="Minya" />
          </label>

          <div class="upload-block">
            <label class="form-label">Profile Picture <span class="optional">(optional)</span></label>
            <div class="upload-area" (click)="fileInput.click()" role="button" tabindex="0">
              <i data-lucide="upload" class="upload-icon"></i>
              <div class="upload-text">Click to upload image</div>
              <div class="upload-hint">JPG, PNG, GIF - max 5 MB</div>
              <input #fileInput type="file" (change)="onProfileImageSelected($event)" accept="image/*" class="d-none" />
            </div>

            <div *ngIf="profileImagePreview" class="image-preview">
              <img [src]="profileImagePreview" alt="Profile preview" class="preview-img" />
              <div class="preview-actions">
                <button type="button" class="remove-image-btn" (click)="selectedProfileImage = undefined; profileImagePreview = undefined;">
                  <i data-lucide="x"></i> Remove
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <label class="custom-checkbox">
            <input type="checkbox" formControlName="agreedToTerms" />
            <span>I agree to the <a href="#" class="link">Terms & Conditions</a> and <a href="#" class="link">Privacy Policy</a></span>
          </label>

          <button type="submit" class="submit-btn" [disabled]="loading">
            <i data-lucide="check-circle" class="btn-icon"></i>
            <span *ngIf="!loading">Create Account</span>
            <span *ngIf="loading">Creating...</span>
          </button>
        </div>
      </form>

      <div class="login-section">
        <p class="login-text">Already have an account? <a [routerLink]="['/login']" class="link link-bold">Login</a></p>
      </div>
    </section>

    <footer class="register-footer">
      <i data-lucide="shield" class="security-icon"></i>
      <span class="security-text">Your data is fully protected</span>
    </footer>
  </div>
</div>
